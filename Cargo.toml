[workspace]
resolver = "2"
members = [
    "crates/bugsbasters-core",
    "crates/bugsbasters-napi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bugsbasters/bugsbasters"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
similar = "2.6"
ignore = "0.4"
owo-colors = "4.0"
thiserror = "1.0"
